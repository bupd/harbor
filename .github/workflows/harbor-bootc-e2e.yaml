name: Harbor bootc E2E

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/harbor-bootc-e2e.yaml
  push:
    branches: [main]
    paths:
      - .github/workflows/harbor-bootc-e2e.yaml
  workflow_dispatch:

env:
  FROZEN_IMAGE: ghcr.io/bupd/harbor-frozen:latest

jobs:
  e2e:
    name: Harbor API smoke test (bootc)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Install podman
        run: sudo apt-get update -qq && sudo apt-get install -y podman

      - name: Pull frozen Harbor image
        run: sudo podman pull "$FROZEN_IMAGE"

      - name: Start frozen Harbor container
        run: |
          sudo podman run -d \
            --name harbor-e2e \
            --privileged \
            --systemd=always \
            --device /dev/null:/dev/kmsg \
            -p 30080:30080 \
            "$FROZEN_IMAGE" \
            /sbin/init

      - name: Wait for k3s node Ready
        timeout-minutes: 5
        run: |
          until sudo podman exec harbor-e2e /usr/bin/kubectl get nodes 2>/dev/null | grep -q " Ready"; do
            sleep 5
          done
          sudo podman exec harbor-e2e /usr/bin/kubectl get nodes

      - name: Wait for Harbor API
        timeout-minutes: 10
        run: |
          until curl -sf http://127.0.0.1:30080/api/v2.0/ping >/dev/null 2>&1; do
            sudo podman exec harbor-e2e /usr/bin/kubectl get pods -A --no-headers 2>/dev/null \
              | grep -v Running | head -5 || true
            sleep 10
          done
          echo "Harbor API is UP"
          curl -sf http://127.0.0.1:30080/api/v2.0/ping

      - name: Smoke test — Harbor API health
        run: |
          # Ping
          result=$(curl -sf http://127.0.0.1:30080/api/v2.0/ping)
          echo "ping: $result"
          echo "$result" | grep -q "pong"

          # System info (unauthenticated)
          curl -sf \
            -u admin:Harbor12345 \
            http://127.0.0.1:30080/api/v2.0/systeminfo \
            | grep -q '"harbor_version"'
          echo "systeminfo OK"

          # List projects (should return library by default)
          project_count=$(curl -sf \
            -u admin:Harbor12345 \
            "http://127.0.0.1:30080/api/v2.0/projects?page_size=10" \
            | python3 -c "import sys,json; print(len(json.load(sys.stdin)))")
          echo "projects visible: $project_count"
          [ "$project_count" -ge 1 ]

      - name: Show Harbor pod status
        if: always()
        run: sudo podman exec harbor-e2e /usr/bin/kubectl get pods -A || true

      - name: Debug on failure
        if: failure()
        run: |
          echo "=== k3s status ==="
          sudo podman exec harbor-e2e systemctl status k3s --no-pager || true
          echo "=== pods ==="
          sudo podman exec harbor-e2e /usr/bin/kubectl get pods -A || true
          echo "=== k3s logs (last 50) ==="
          sudo podman exec harbor-e2e journalctl -u k3s -n 50 --no-pager || true
