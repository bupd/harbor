name: Sync and Verify Patches

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

# Note: GITHUB_TOKEN cannot push workflow file changes. Upstream workflows
# are reverted after merge in the sync task (taskfile/sync.yml).
permissions:
  contents: write
  issues: write

concurrency:
  group: sync-and-verify
  cancel-in-progress: false

jobs:
  sync-and-verify:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Checkout main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Rebase on latest origin/main
        run: |
          git fetch origin
          git rebase origin/main

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install Task
        uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
        with:
          version: 3.x

      - name: Install StGit
        env:
          STGIT_VERSION: "2.5.5"
        run: |
          curl -fsSL "https://github.com/stacked-git/stgit/releases/download/v${STGIT_VERSION}/stgit_${STGIT_VERSION}-1_amd64.deb" -o /tmp/stgit.deb
          sudo dpkg -i /tmp/stgit.deb
          rm /tmp/stgit.deb
          stg --version

      - name: Sync and verify
        id: sync
        run: task sync:sync-and-verify
        continue-on-error: true

      - name: Install GitHub CLI
        if: steps.sync.outcome == 'failure'
        run: |
          case "$(uname -m)" in
            x86_64|amd64) arch="amd64" ;;
            aarch64|arm64) arch="arm64" ;;
            *)
              echo "Unsupported architecture: $(uname -m)"
              exit 1
              ;;
          esac

          gh_version="$(python3 - <<'PY'
import json
import urllib.request

with urllib.request.urlopen("https://api.github.com/repos/cli/cli/releases/latest") as response:
    print(json.load(response)["tag_name"].removeprefix("v"))
PY
          )"

          curl -fsSL "https://github.com/cli/cli/releases/download/v${gh_version}/gh_${gh_version}_linux_${arch}.deb" -o /tmp/gh.deb
          sudo dpkg -i /tmp/gh.deb
          rm /tmp/gh.deb
          gh --version

      - name: Create issue on failure
        if: steps.sync.outcome == 'failure'
        run: |
          run_url="${SERVER_URL}/${REPO}/actions/runs/${RUN_ID}"

          body="Sync or patch verification failed.

          **Workflow run:** ${run_url}

          Check the [workflow logs](${run_url}) for details."

          existing=$(gh issue list --label sync --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create \
              --title "Sync failed: harbor-next/main into main" \
              --label sync \
              --body "$body"
          fi
          exit 1
        env:
          GH_TOKEN: ${{ github.token }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
