version: '3'

set:
  - errexit
  - pipefail

vars:
  UPSTREAM_REMOTE: '{{.UPSTREAM_REMOTE | default "harbor-next"}}'
  UPSTREAM_URL: '{{.UPSTREAM_URL | default "https://github.com/container-registry/harbor-next.git"}}'
  UPSTREAM_BRANCH: '{{.UPSTREAM_BRANCH | default "main"}}'
  PATCHES_DIR: "8gcr-ee/patches"
  RERERE_DIR: "8gcr-ee/.rr-cache"

tasks:
  sync-and-verify:
    desc: "Full sync: merge upstream, verify/rebase patches, push"
    cmds:
      - task: fetch-upstream
      - task: merge-upstream
      - task: sanity-check
      - task: verify-patches
      - task: save-rerere
      - task: push

  fetch-upstream:
    desc: "Add and fetch harbor-next remote"
    cmds:
      - git remote add {{.UPSTREAM_REMOTE}} {{.UPSTREAM_URL}} 2>/dev/null || true
      - git fetch {{.UPSTREAM_REMOTE}} {{.UPSTREAM_BRANCH}}
      - |
        count=$(git rev-list HEAD..{{.UPSTREAM_REMOTE}}/{{.UPSTREAM_BRANCH}} --count)
        echo "$count new commit(s) from {{.UPSTREAM_REMOTE}}/{{.UPSTREAM_BRANCH}}"

  merge-upstream:
    desc: "Merge harbor-next/main into current branch with rerere"
    cmds:
      - |
        count=$(git rev-list HEAD..{{.UPSTREAM_REMOTE}}/{{.UPSTREAM_BRANCH}} --count)
        if [ "$count" -eq 0 ]; then
          echo "Nothing to merge — already up to date"
          exit 0
        fi

        # Configure merge drivers and rerere
        git config merge.ours.driver true
        git config rerere.enabled true
        git config rerere.autoUpdate true
        rr_cache_dir="$(git rev-parse --git-path rr-cache)"
        if [ -d "{{.RERERE_DIR}}" ]; then
          mkdir -p "$rr_cache_dir"
          cp -r {{.RERERE_DIR}}/* "$rr_cache_dir"/ 2>/dev/null || true
          echo "Restored rerere cache"
        fi

        # Save pre-merge state of .github/workflows/ so we can restore it.
        # GITHUB_TOKEN cannot push workflow file changes (needs 'workflows'
        # scope which only PATs have), so upstream workflow changes must be
        # excluded from the merge result.
        pre_merge_sha=$(git rev-parse HEAD)

        if ! git merge {{.UPSTREAM_REMOTE}}/{{.UPSTREAM_BRANCH}} --no-edit; then
          conflicts=$(git diff --name-only --diff-filter=U)
          if [ -n "$conflicts" ] && ! printf '%s\n' "$conflicts" | grep -qv '^.github/workflows/'; then
            echo "Auto-resolving workflow-only conflicts (GITHUB_TOKEN limitation)"
            printf '%s\n' "$conflicts" | while IFS= read -r f; do
              [ -n "$f" ] || continue
              if git cat-file -e "${pre_merge_sha}:${f}" 2>/dev/null; then
                git checkout --ours -- "$f"
                git add "$f"
              else
                git rm -f -- "$f"
              fi
            done

            if git diff --name-only --diff-filter=U | grep -q .; then
              echo "ERROR: Workflow conflict auto-resolution left unresolved files"
              git diff --name-only --diff-filter=U
              exit 1
            fi

            git commit --no-edit
          else
            echo "ERROR: Merge conflict with {{.UPSTREAM_REMOTE}}/{{.UPSTREAM_BRANCH}}"
            echo ""
            echo "Conflicting files:"
            printf '%s\n' "$conflicts"
            echo ""
            echo "Resolve manually, then run: task sync:push"
            exit 1
          fi
        fi

        # Restore .github/workflows/ to pre-merge state.
        # Use git diff --diff-filter to find added/modified/deleted files.
        if ! git diff --quiet "$pre_merge_sha" HEAD -- .github/workflows/ 2>/dev/null; then
          echo "Reverting upstream workflow changes (GITHUB_TOKEN limitation)"
          # Restore files that existed before merge (modified or deleted by upstream)
          git checkout "$pre_merge_sha" -- .github/workflows/ 2>/dev/null || true
          # Remove files added by upstream that didn't exist before
          git diff --name-only --diff-filter=A "$pre_merge_sha" HEAD -- .github/workflows/ | while read -r f; do
            git rm -f "$f" 2>/dev/null || true
          done
          git commit --amend --no-edit
        fi
        echo "Merge complete"

  sanity-check:
    desc: "Verify critical files exist after merge"
    cmds:
      - |
        test -f {{.PATCHES_DIR}}/series || { echo "ERROR: {{.PATCHES_DIR}}/series missing after merge"; exit 1; }
        test -d .github || { echo "ERROR: .github directory missing after merge"; exit 1; }
        echo "Sanity check passed"

  verify-patches:
    desc: "Verify 8gcr-ee patches apply cleanly, rebase if needed"
    cmds:
      - |
        # Enable rerere
        git config rerere.enabled true
        git config rerere.autoUpdate true
        rr_cache_dir="$(git rev-parse --git-path rr-cache)"
        if [ -d "{{.RERERE_DIR}}" ]; then
          mkdir -p "$rr_cache_dir"
          cp -r {{.RERERE_DIR}}/* "$rr_cache_dir"/ 2>/dev/null || true
        fi

        main_branch=$(git rev-parse --abbrev-ref HEAD)
        main_sha=$(git rev-parse HEAD)
        short_sha=$(printf '%s' "$main_sha" | cut -c1-12)
        verify_branch="wip/verify-patches-${short_sha}-$$"
        rebase_branch="wip/rebase-patches-${short_sha}-$$"
        patches_tmpdir="$(mktemp -d)"
        readme_backup=""

        cleanup_branch() {
          branch="$1"
          git checkout "$main_branch" >/dev/null 2>&1 || true
          stg branch --cleanup --force "$branch" >/dev/null 2>&1 || true
          git branch -D "$branch" >/dev/null 2>&1 || true
        }

        echo "=== Phase 1: Try direct patch apply ==="
        cleanup_branch "$verify_branch"
        git checkout -b "$verify_branch" HEAD
        stg init 2>/dev/null || true

        if stg import -3 -S {{.PATCHES_DIR}}/series; then
          echo "All patches applied cleanly"
          cleanup_branch "$verify_branch"
          rm -rf "$patches_tmpdir"
          exit 0
        fi

        echo "Direct apply failed, attempting rebase..."

        # Clean up failed apply
        stg repair 2>/dev/null || true
        git reset --hard HEAD
        cleanup_branch "$verify_branch"

        echo "=== Phase 2: Rebase fallback ==="
        base_sha=$(head -1 {{.PATCHES_DIR}}/series | sed -n 's/^# This series applies on Git commit //p')
        if [ -z "$base_sha" ]; then
          echo "ERROR: Could not parse base commit from series file"
          rm -rf "$patches_tmpdir"
          exit 1
        fi
        echo "Base commit: $base_sha"

        if ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
          echo "Base commit not found locally, fetching from {{.UPSTREAM_REMOTE}}"
          git fetch {{.UPSTREAM_REMOTE}} "$base_sha" || true
          if ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
            echo "ERROR: Base commit $base_sha not reachable"
            rm -rf "$patches_tmpdir"
            exit 1
          fi
        fi

        # Copy patches before checkout (directory may not exist at base commit)
        cp -r {{.PATCHES_DIR}} "$patches_tmpdir/patches"

        cleanup_branch "$rebase_branch"
        git checkout -b "$rebase_branch" "$base_sha"
        stg init 2>/dev/null || true
        stg import -3 -S "$patches_tmpdir/patches/series"

        if ! stg rebase "$main_branch"; then
          failed_patch=$(stg top 2>/dev/null || echo "unknown")
          echo "ERROR: Rebase failed on patch: $failed_patch"
          echo "Conflicting files:"
          git diff --name-only --diff-filter=U 2>/dev/null
          echo ""
          echo "Manual resolution:"
          echo "  git add <resolved-files>"
          echo "  stg refresh"
          echo "  stg push -a"
          echo "  stg export -d {{.PATCHES_DIR}}/"
          cleanup_branch "$rebase_branch"
          rm -rf "$patches_tmpdir"
          exit 1
        fi

        echo "Rebase succeeded, exporting patches..."

        # Preserve README
        readme_path="{{.PATCHES_DIR}}/README.md"
        if [ -f "$readme_path" ]; then
          readme_backup="$(mktemp)"
          cp "$readme_path" "$readme_backup"
        fi

        stg export -d {{.PATCHES_DIR}}/

        # Restore README
        if [ -n "$readme_backup" ] && [ -f "$readme_backup" ]; then
          cp "$readme_backup" "$readme_path"
        fi

        # Update base commit in series file
        sed -i "1s|^# This series applies on Git commit .*|# This series applies on Git commit $main_sha|" {{.PATCHES_DIR}}/series

        # Commit rebased patches from main
        git checkout "$main_branch"
        git add {{.PATCHES_DIR}}/
        git commit -sm "fix(patches): rebase patches on updated main"
        cleanup_branch "$rebase_branch"
        rm -rf "$patches_tmpdir"
        rm -f "$readme_backup"

        echo "Patches rebased and committed"

  save-rerere:
    desc: "Save git rerere cache to repo (if any resolutions recorded)"
    cmds:
      - |
        rr_cache_dir="$(git rev-parse --git-path rr-cache)"
        if [ -d "$rr_cache_dir" ] && [ "$(ls -A "$rr_cache_dir" 2>/dev/null)" ]; then
          mkdir -p {{.RERERE_DIR}}
          cp -r "$rr_cache_dir"/* {{.RERERE_DIR}}/
          git add {{.RERERE_DIR}}/
          git diff --cached --quiet {{.RERERE_DIR}}/ 2>/dev/null || \
            git commit -sm "chore: update git rerere cache"
          echo "Rerere cache saved"
        else
          echo "No rerere cache to save"
        fi

  push:
    desc: "Push current branch to origin"
    cmds:
      - git push --force-with-lease origin HEAD
